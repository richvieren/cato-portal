<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cato Vermeulen — Client Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script src="dashboard.js"></script>
</head>
<body>

  <!-- ── Login screen ──────────────────────────────────── -->
  <div id="login-screen" class="page-center" style="display:none">
    <div class="login-wrap">
      <img src="img/logo.png" alt="Cato Vermeulen" style="max-width:280px;margin-bottom:1.5rem;">
      <p>Client Portal</p>

      <div id="login-form">
        <input type="email" id="email-input" placeholder="Your email address" autocomplete="email">
        <button class="btn btn-primary" id="send-link-btn" onclick="handleSendLink()">Send access link</button>
        <div class="error-msg" id="login-error"></div>
      </div>

      <div id="login-sent" class="login-sent" style="display:none">
        <p>Check your inbox.</p>
        <p style="margin-top:0.8rem;color:var(--stone);font-size:0.85rem">
          We've sent a login link to your email.<br>Click it to enter your portal.
        </p>
      </div>
    </div>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────── -->
  <div id="dashboard-screen" style="display:none">
    <div class="dashboard-header">
      <img src="img/icon.png" alt="Cato Vermeulen" style="height:60px;">
      <div class="header-right">
        <span class="user-email" id="user-email"></span>
        <button class="sign-out-btn" onclick="signOut()">Sign out</button>
      </div>
    </div>

    <div class="dashboard-hero">
      <img src="img/logo.png" alt="Cato Vermeulen" style="max-width:260px;margin-bottom:1.2rem;display:block;margin-left:auto;margin-right:auto;">
      <h2>Your <em>Portal.</em></h2>
      <p>Everything you have access to, in one place.</p>
    </div>

    <div class="container">
      <!-- Purchased readings -->
      <div id="purchased-section" style="display:none">
        <p class="section-label" style="color:var(--golden);font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:1.5rem;">Your Readings</p>
        <div class="cards-grid" id="purchased-grid"></div>
      </div>

      <!-- Also available -->
      <div id="available-section" style="display:none;margin-top:3rem;">
        <p class="section-label" style="color:var(--stone);font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:1.5rem;">Also Available</p>
        <div class="cards-grid" id="available-grid"></div>
      </div>
    </div>
  </div>

  <script>
    window.SUPABASE_URL = 'https://fdewbbrzetgqqsonpqvp.supabase.co';

    async function init() {
      const session = await getSession();
      if (!session) {
        document.getElementById('login-screen').style.display = 'flex';
        return;
      }
      await loadDashboard(session);
    }

    async function loadDashboard(session) {
      document.getElementById('dashboard-screen').style.display = 'block';
      document.getElementById('user-email').textContent = session.user.email;
      const [grant, miniGrant, courseGrant, transitGrant, astroGrant, profile] = await Promise.all([
        getBlueprintGrant(),
        getMiniReadingGrant(),
        getCourseGrant(),
        getTransitGrant(),
        getAstrocartographyGrant(),
        getProfile(),
      ]);

      const purchasedGrid = document.getElementById('purchased-grid');
      const availableGrid = document.getElementById('available-grid');

      // All products with their grant status
      const products = [
        { id: 'blueprint', grant, render: () => { renderBlueprintCard(blueprintState(grant, profile), grant); } },
        // mini-reading hidden — no longer offered
        { id: 'transit', grant: transitGrant, render: () => { renderTransitCard(transitState(transitGrant, profile), transitGrant); } },
        { id: 'astrocartography', grant: astroGrant, render: () => { renderAstrocartographyCard(astrocartographyState(astroGrant, profile), astroGrant); } },
        { id: 'course', grant: courseGrant, render: () => { renderCourseCard(courseState(courseGrant)); } },
      ];

      let hasPurchased = false;
      let hasAvailable = false;

      products.forEach(({ id, grant: g, render }) => {
        // Create the card element
        const card = document.createElement('div');
        card.className = 'card';
        card.id = id + '-card';

        if (g) {
          // Purchased — goes in top section
          purchasedGrid.appendChild(card);
          hasPurchased = true;
        } else {
          // Not purchased — goes in bottom section
          availableGrid.appendChild(card);
          hasAvailable = true;
        }

        render();
      });

      if (hasPurchased) document.getElementById('purchased-section').style.display = 'block';
      if (hasAvailable) document.getElementById('available-section').style.display = 'block';
    }

    async function handleSendLink() {
      const email = document.getElementById('email-input').value.trim();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('send-link-btn');
      errEl.textContent = '';

      if (!email) { errEl.textContent = 'Enter your email address.'; return; }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      const { error } = await sendMagicLink(email);

      if (error) {
        errEl.textContent = error.message || 'Something went wrong. Try again.';
        btn.disabled = false;
        btn.textContent = 'Send access link';
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('login-sent').style.display = 'block';
      }
    }

    init();
  </script>
</body>
</html>
